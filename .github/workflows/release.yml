name: Release

# Publishes to PyPI with Trusted Publishing (no API token stored in GitHub).
# One-time setup on pypi.org and test.pypi.org: add a "pending publisher" for
#   owner: Kunjoe7, repository: texgisa-survival, workflow: release.yml,
#   environment: pypi (PyPI) / testpypi (TestPyPI)
#
# - Manual run (Actions tab -> Release -> Run workflow): build, test, upload to TestPyPI
# - Publishing a GitHub release (tag vX.Y.Z): build, test, upload to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-wheel:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel and run the tests against it
        shell: bash
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[recipes,baselines]" pytest
          mv src src_unused   # make sure the installed wheel is tested, not the source tree
          python -m pytest tests -q --override-ini="addopts="

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: test-wheel
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: test-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
